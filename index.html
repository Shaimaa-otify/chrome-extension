<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>DevMark</h1>
            <form novalidate class="search-form">            
                <input type="search" id="searchBar" name="q" placeholder="Search..." class="search-bar">          
            </form>
        </header>
        <hr>
        
        <form novalidate class="add-form">
            <h2>Add Resource</h2>
            <label for="title-el">Title:</label>
            <input type="text" id="title-el" placeholder="Creating games with JS">

            <label for="tag-input-el">Tags:</label>
            <input type="text" id="tag-input-el" placeholder="Javascript, html, css">

            

            <label for="url-el">Url:</label>
            <input type="text" id="url-el" >

            <div class="radio-input-containers">
                <legend>Read:</legend>

                <div class="radio-container">
                    <input type="radio" id="read-yes" name="read" value="yes">
                    <label for="read-yes">Yes</label>
                </div>           
            
                <div class="radio-container">
                    <input type="radio" id="reade-no" name="read" value="no" checked>
                    <label for="read-no">No</label>
                </div>
            </div>
                       
            <button id="save-btn" class="save-btn">SAVE TAB</button>
        </form>
        <hr>
            
            
            
        
        <div>
            <div class="btns-container">
                <button id="show-resources-btn" class="solid-btn">SHOW ALL</button>
                <button id="delete-all-btn" class="clear-btn">DELETE ALL</button>
            </div>

            <div id="chips-el">               
            </div>

            <div class="resouces-container">             
                <ul id="ul-el"></ul>
            </div>

            
        </div>
        <script src="index.js"></script>
    </body>
</html>
